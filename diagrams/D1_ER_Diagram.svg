<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .tbl-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .tbl-field { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #1e293b; }
      .pk { font-weight: bold; fill: #0284c7; }
      .fk { font-style: italic; fill: #64748b; }
      .line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .card-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6px; }
    </style>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title">MubeenMart — Entity Relationship Diagram (D1)</text>

  <!-- Table: users -->
  <g transform="translate(50, 60)">
    <rect class="card-bg" width="260" height="150" />
    <path d="M 0,0 L 260,0 L 260,28 L 0,28 Z" fill="#2563eb" rx="6" />
    <text x="130" y="19" text-anchor="middle" class="tbl-header">users</text>
    <text x="15" y="48" class="tbl-field pk">id : BIGINT (PK, AUTO)</text>
    <text x="15" y="68" class="tbl-field">name : VARCHAR(100)</text>
    <text x="15" y="88" class="tbl-field">email : VARCHAR(100) UNIQUE</text>
    <text x="15" y="108" class="tbl-field">password_hash : VARCHAR(255)</text>
    <text x="15" y="128" class="tbl-field">role : ENUM(BUYER,SELLER,ADMIN)</text>
    <text x="15" y="148" class="tbl-field">created_at : TIMESTAMP</text>
  </g>

  <!-- Table: products -->
  <g transform="translate(370, 60)">
    <rect class="card-bg" width="260" height="180" />
    <path d="M 0,0 L 260,0 L 260,28 L 0,28 Z" fill="#059669" rx="6" />
    <text x="130" y="19" text-anchor="middle" class="tbl-header">products</text>
    <text x="15" y="48" class="tbl-field pk">id : BIGINT (PK, AUTO)</text>
    <text x="15" y="68" class="tbl-field fk">seller_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="88" class="tbl-field">name : VARCHAR(200)</text>
    <text x="15" y="108" class="tbl-field">description : CLOB</text>
    <text x="15" y="128" class="tbl-field">price : DECIMAL(10,2)</text>
    <text x="15" y="148" class="tbl-field">stock_qty : INT</text>
    <text x="15" y="168" class="tbl-field">category : VARCHAR(50)</text>
  </g>

  <!-- Table: orders -->
  <g transform="translate(690, 60)">
    <rect class="card-bg" width="260" height="140" />
    <path d="M 0,0 L 260,0 L 260,28 L 0,28 Z" fill="#7c3aed" rx="6" />
    <text x="130" y="19" text-anchor="middle" class="tbl-header">orders</text>
    <text x="15" y="48" class="tbl-field pk">id : BIGINT (PK, AUTO)</text>
    <text x="15" y="68" class="tbl-field fk">buyer_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="88" class="tbl-field">status : ENUM(PENDING..)</text>
    <text x="15" y="108" class="tbl-field">total_amount : DECIMAL(10,2)</text>
    <text x="15" y="128" class="tbl-field">created_at : TIMESTAMP</text>
  </g>

  <!-- Table: order_items -->
  <g transform="translate(690, 270)">
    <rect class="card-bg" width="260" height="140" />
    <path d="M 0,0 L 260,0 L 260,28 L 0,28 Z" fill="#4f46e5" rx="6" />
    <text x="130" y="19" text-anchor="middle" class="tbl-header">order_items</text>
    <text x="15" y="48" class="tbl-field pk">id : BIGINT (PK, AUTO)</text>
    <text x="15" y="68" class="tbl-field fk">order_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="88" class="tbl-field fk">product_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="108" class="tbl-field">quantity : INT</text>
    <text x="15" y="128" class="tbl-field">unit_price : DECIMAL(10,2)</text>
  </g>

  <!-- Table: cart_items -->
  <g transform="translate(50, 300)">
    <rect class="card-bg" width="260" height="140" />
    <path d="M 0,0 L 260,0 L 260,28 L 0,28 Z" fill="#d97706" rx="6" />
    <text x="130" y="19" text-anchor="middle" class="tbl-header">cart_items</text>
    <text x="15" y="48" class="tbl-field pk">id : BIGINT (PK, AUTO)</text>
    <text x="15" y="68" class="tbl-field fk">user_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="88" class="tbl-field fk">product_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="108" class="tbl-field">quantity : INT</text>
    <text x="15" y="128" class="tbl-field">created_at : TIMESTAMP</text>
  </g>

  <!-- Table: reviews -->
  <g transform="translate(370, 320)">
    <rect class="card-bg" width="260" height="150" />
    <path d="M 0,0 L 260,0 L 260,28 L 0,28 Z" fill="#0891b2" rx="6" />
    <text x="130" y="19" text-anchor="middle" class="tbl-header">reviews</text>
    <text x="15" y="48" class="tbl-field pk">id : BIGINT (PK, AUTO)</text>
    <text x="15" y="68" class="tbl-field fk">product_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="88" class="tbl-field fk">user_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="108" class="tbl-field">rating : INT (1-5)</text>
    <text x="15" y="128" class="tbl-field">comment : CLOB</text>
    <text x="15" y="148" class="tbl-field">created_at : TIMESTAMP</text>
  </g>

  <!-- Table: wishlist_items -->
  <g transform="translate(200, 520)">
    <rect class="card-bg" width="260" height="130" />
    <path d="M 0,0 L 260,0 L 260,28 L 0,28 Z" fill="#e11d48" rx="6" />
    <text x="130" y="19" text-anchor="middle" class="tbl-header">wishlist_items</text>
    <text x="15" y="48" class="tbl-field pk">id : BIGINT (PK, AUTO)</text>
    <text x="15" y="68" class="tbl-field fk">user_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="88" class="tbl-field fk">product_id : BIGINT (FK, INDEX)</text>
    <text x="15" y="108" class="tbl-field">created_at : TIMESTAMP</text>
  </g>

  <!-- Relationship Lines -->
  <!-- users -> products -->
  <path d="M 310,135 L 370,135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <!-- users -> orders -->
  <path d="M 180,60 L 180,45 L 820,45 L 820,60" stroke="#7c3aed" stroke-width="1.5" fill="none" />
  <!-- orders -> order_items -->
  <path d="M 820,200 L 820,270" stroke="#4f46e5" stroke-width="2" />
  <!-- products -> order_items -->
  <path d="M 630,150 L 720,150 L 720,270" stroke="#059669" stroke-width="1.5" fill="none" />
  <!-- users -> cart_items -->
  <path d="M 180,210 L 180,300" stroke="#d97706" stroke-width="2" />
  <!-- products -> cart_items -->
  <path d="M 400,240 L 400,270 L 280,270 L 280,300" stroke="#059669" stroke-width="1.5" fill="none" />
  <!-- products -> reviews -->
  <path d="M 500,240 L 500,320" stroke="#0891b2" stroke-width="2" />
</svg>
