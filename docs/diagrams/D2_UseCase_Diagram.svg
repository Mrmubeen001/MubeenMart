<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .actor-label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .uc-box { fill: #f8fafc; stroke: #3b82f6; stroke-width: 1.5; rx: 18px; }
      .uc-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #1e293b; text-anchor: middle; }
      .assoc { stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="480" y="30" text-anchor="middle" class="title">MubeenMart — Use Case Diagram (D2)</text>

  <!-- System Boundary -->
  <rect x="220" y="55" width="520" height="540" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10" />
  <text x="240" y="80" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#64748b">SYSTEM BOUNDARY: MUBEENMART</text>

  <!-- Actors -->
  <!-- Buyer -->
  <g transform="translate(90, 160)">
    <circle cx="20" cy="15" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <line x1="20" y1="29" x2="20" y2="60" stroke="#2563eb" stroke-width="2"/>
    <line x1="5" y1="42" x2="35" y2="42" stroke="#2563eb" stroke-width="2"/>
    <line x1="20" y1="60" x2="5" y2="85" stroke="#2563eb" stroke-width="2"/>
    <line x1="20" y1="60" x2="35" y2="85" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="105" class="actor-label">Buyer</text>
  </g>

  <!-- Seller -->
  <g transform="translate(90, 420)">
    <circle cx="20" cy="15" r="14" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <line x1="20" y1="29" x2="20" y2="60" stroke="#059669" stroke-width="2"/>
    <line x1="5" y1="42" x2="35" y2="42" stroke="#059669" stroke-width="2"/>
    <line x1="20" y1="60" x2="5" y2="85" stroke="#059669" stroke-width="2"/>
    <line x1="20" y1="60" x2="35" y2="85" stroke="#059669" stroke-width="2"/>
    <text x="20" y="105" class="actor-label">Seller</text>
  </g>

  <!-- Admin -->
  <g transform="translate(850, 280)">
    <circle cx="20" cy="15" r="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <line x1="20" y1="29" x2="20" y2="60" stroke="#7c3aed" stroke-width="2"/>
    <line x1="5" y1="42" x2="35" y2="42" stroke="#7c3aed" stroke-width="2"/>
    <line x1="20" y1="60" x2="5" y2="85" stroke="#7c3aed" stroke-width="2"/>
    <line x1="20" y1="60" x2="35" y2="85" stroke="#7c3aed" stroke-width="2"/>
    <text x="20" y="105" class="actor-label">Admin</text>
  </g>

  <!-- Use Cases -->
  <!-- Common -->
  <g transform="translate(360, 90)">
    <rect class="uc-box" width="240" height="36" />
    <text x="120" y="23" class="uc-text">F1: Register &amp; Login (Session)</text>
  </g>
  <g transform="translate(360, 140)">
    <rect class="uc-box" width="240" height="36" />
    <text x="120" y="23" class="uc-text">F3: Browse &amp; Filter Products</text>
  </g>
  <g transform="translate(360, 190)">
    <rect class="uc-box" width="240" height="36" />
    <text x="120" y="23" class="uc-text">F4: Manage Shopping Cart</text>
  </g>
  <g transform="translate(360, 240)">
    <rect class="uc-box" width="240" height="36" />
    <text x="120" y="23" class="uc-text">F5: Mock Checkout &amp; Pay</text>
  </g>
  <g transform="translate(360, 290)">
    <rect class="uc-box" width="240" height="36" />
    <text x="120" y="23" class="uc-text">F6: View Order History</text>
  </g>
  <g transform="translate(360, 340)">
    <rect class="uc-box" width="240" height="36" />
    <text x="120" y="23" class="uc-text">F8: Review Completed Orders</text>
  </g>

  <!-- Seller specific -->
  <g transform="translate(360, 390)">
    <rect class="uc-box" width="240" height="36" stroke="#059669" />
    <text x="120" y="23" class="uc-text">F2: Seller Product Management</text>
  </g>
  <g transform="translate(360, 440)">
    <rect class="uc-box" width="240" height="36" stroke="#059669" />
    <text x="120" y="23" class="uc-text">O2: Order Status Fulfillment</text>
  </g>
  <g transform="translate(360, 490)">
    <rect class="uc-box" width="240" height="36" stroke="#059669" />
    <text x="120" y="23" class="uc-text">O3: Seller Sales Dashboard</text>
  </g>

  <!-- Admin specific -->
  <g transform="translate(360, 540)">
    <rect class="uc-box" width="240" height="36" stroke="#7c3aed" />
    <text x="120" y="23" class="uc-text">F7: Moderate Listings &amp; Users</text>
  </g>

  <!-- Connection Lines -->
  <!-- Buyer -->
  <line x1="130" y1="190" x2="360" y2="108" class="assoc" />
  <line x1="130" y1="190" x2="360" y2="158" class="assoc" />
  <line x1="130" y1="190" x2="360" y2="208" class="assoc" />
  <line x1="130" y1="190" x2="360" y2="258" class="assoc" />
  <line x1="130" y1="190" x2="360" y2="308" class="assoc" />
  <line x1="130" y1="190" x2="360" y2="358" class="assoc" />

  <!-- Seller -->
  <line x1="130" y1="450" x2="360" y2="108" class="assoc" />
  <line x1="130" y1="450" x2="360" y2="408" class="assoc" />
  <line x1="130" y1="450" x2="360" y2="458" class="assoc" />
  <line x1="130" y1="450" x2="360" y2="508" class="assoc" />

  <!-- Admin -->
  <line x1="850" y1="310" x2="600" y2="108" class="assoc" />
  <line x1="850" y1="310" x2="600" y2="558" class="assoc" />
</svg>
